<div id="eventstatus"
  class="ajaxstatus h-100"
  #if($content == $page)data-ajaxrunning="true"#end
  ajaxpath="$siteroot$apphome/views/settings/events/triggers/edit/log.html?eventpath=$pathevent.getPage().getPath()&lastrun=$!pathevent.getLastRun()"
>
  <div class="position-sticky bg-light py-1 p-2" style="top:0">
    <div class="d-flex justify-content-between">

      <p class="m-0">
        #set($lastrun = $context.getRequestParameter("lastrun"))
        
        <b>[[Last ran]]:</b> <span class="eventlastrun #if($lastrun && $lastrun!=$pathevent.getLastRun()) eventupdated #end">$!pathevent.getFormattedLastRun()</span>
        <br/>
        <b>[[Total Runs]]:</b> $pathevent.getTotalRunCount()
      </p>
	  #if( $pathevent.isRunning() )
	  <p class="d-flex align-items-center m-0" style="font-weight: bold;">
	    <svg height="12" width="12" class="blinking">
	      <circle cx="6" cy="6" r="6" fill="#94e594" /> 
	    </svg>
	    &nbsp;[[Event is running]]
	  </p>
	  #end
    </div>
  </div>
  <div class="overflow-y output-container  p-2 d-hide-empty border-top-subtle">$!pathevent.getLastOutputHtml()</div>
</div>
